repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.7.4
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-yaml
      - id: detect-private-key
  - repo: local
    hooks:
      - id: no-terraform-plans
        name: Block Terraform plans and state
        entry: scripts/check_no_plans.sh
        language: script
        pass_filenames: false

