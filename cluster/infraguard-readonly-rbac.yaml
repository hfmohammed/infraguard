apiVersion: v1
kind: ServiceAccount
metadata:
  name: infraguard
  namespace: default
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: infraguard-readonly
rules:
  - apiGroups: ["", "apps", "batch", "networking.k8s.io"]
    resources: ["namespaces", "pods", "services", "deployments", "statefulsets", "daemonsets", "jobs", "cronjobs", "ingresses", "networkpolicies"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: infraguard-readonly
subjects:
  - kind: ServiceAccount
    name: infraguard
    namespace: default
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: infraguard-readonly

