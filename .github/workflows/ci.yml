name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -e '.[dev]'
      - run: make lint
      - uses: gitleaks/gitleaks-action@v2

  unit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "${{ matrix.python }}", cache: pip}
      - run: pip install -e '.[dev]'
      - name: Build and smoke-test the installed wheel outside the checkout
        run: |
          pip wheel --no-deps . --wheel-dir /tmp/infraguard-dist
          python -m venv /tmp/infraguard-installed
          /tmp/infraguard-installed/bin/pip install /tmp/infraguard-dist/*.whl
          cd /tmp
          /tmp/infraguard-installed/bin/infraguard policies list --format json
      - run: pytest -m 'not integration' --cov=infraguard --cov-report=xml --cov-fail-under=85
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.python }}
          path: coverage.xml

  validate-iac:
    needs: [lint, unit]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -e '.[dev]'
      - name: Install the pinned validation toolchain
        run: ./scripts/install-tools.sh
      - name: Test Rego policies
        run: ./bin/opa test policies/kubernetes/*.rego policies/terraform/*.rego -v
      - name: Validate Helm charts and rendered schemas
        run: |
          ./bin/helm lint samples/charts/compliant-app samples/charts/noncompliant-app
          ./bin/helm template compliant samples/charts/compliant-app | ./bin/kubeconform -strict -summary -kubernetes-version 1.30.0
          ./bin/helm template noncompliant samples/charts/noncompliant-app | ./bin/kubeconform -strict -summary -kubernetes-version 1.30.0
      - name: Validate Terraform modules
        run: |
          ./bin/terraform fmt -check -recursive samples/terraform
          ./bin/terraform -chdir=samples/terraform/compliant init -backend=false
          ./bin/terraform -chdir=samples/terraform/compliant validate
          ./bin/terraform -chdir=samples/terraform/noncompliant init -backend=false
          ./bin/terraform -chdir=samples/terraform/noncompliant validate
      - name: Verify real Terraform plans with mock credentials
        run: |
          export PATH="$GITHUB_WORKSPACE/bin:$PATH"
          infraguard scan --no-cluster --terraform-dir samples/terraform/compliant --fail-on LOW --format json --output-dir reports/terraform-compliant
          set +e
          infraguard scan --no-cluster --terraform-dir samples/terraform/noncompliant --format json --output-dir reports/terraform-noncompliant
          code=$?
          test "$code" -eq 1
      - name: Prove Conftest policy gates
        run: |
          ./bin/conftest test samples/manifests/compliant --policy policies/kubernetes --namespace infraguard.kubernetes
          if ./bin/conftest test samples/manifests/noncompliant --policy policies/kubernetes --namespace infraguard.kubernetes; then
            echo "expected noncompliant manifests to fail policy validation" >&2
            exit 1
          fi
          if ./bin/conftest test samples/terraform/plan-fixtures/noncompliant.plan.fixture.json --policy policies/terraform --namespace infraguard.terraform; then
            echo "expected noncompliant Terraform plan to fail policy validation" >&2
            exit 1
          fi
      - run: python -m infraguard validate samples/manifests/compliant --fail-on LOW
      - name: Prove the negative gate
        run: |
          set +e
          python -m infraguard validate samples/manifests/noncompliant >/tmp/negative-gate.log 2>&1
          code=$?
          test "$code" -eq 1

  integration:
    needs: [unit, validate-iac]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - uses: azure/setup-helm@v4
        with: {version: v3.15.3}
      - uses: helm/kind-action@v1
        with:
          cluster_name: infraguard
          config: cluster/kind-config.yaml
          node_image: kindest/node:v1.30.2
      - run: pip install -e '.[dev]'
      - name: Install schema and policy binaries
        run: |
          ./scripts/install-tools.sh
          echo "$GITHUB_WORKSPACE/bin" >> "$GITHUB_PATH"
      - run: make deploy-samples
      - run: pytest -m integration --timeout=300
      - run: infraguard scan --context kind-infraguard -n ig-compliant --fail-on LOW --format json --format markdown --metrics-file reports/metrics.prom
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-reports
          path: reports/
      - name: Publish scan evidence in the job summary
        if: always()
        run: |
          for report in reports/*.md; do
            if test -f "$report"; then cat "$report" >> "$GITHUB_STEP_SUMMARY"; fi
          done

