proposal_id: checked-privileged-fix
finding_fingerprint: demo-privileged
policy_id: K8S-SEC-001
target: {source: kubernetes_live, kind: Deployment, name: vulnerable-app, namespace: ig-noncompliant}
proposed_manifest:
  apiVersion: apps/v1
  kind: Deployment
  metadata:
    name: vulnerable-app
    namespace: ig-noncompliant
    labels: {app: vulnerable-app, infraguard.io/tier: prod}
  spec:
    replicas: 1
    selector: {matchLabels: {app: vulnerable-app}}
    template:
      metadata: {labels: {app: vulnerable-app}}
      spec:
        hostNetwork: true
        volumes: [{name: host, hostPath: {path: /var/run}}]
        containers:
          - name: unsafe-sidecar
            image: nginx:latest
            securityContext: {privileged: true}
          - name: app
            image: nginx:latest
            securityContext:
              privileged: false
              runAsUser: 0
              allowPrivilegeEscalation: true
              readOnlyRootFilesystem: false
              capabilities: {add: [SYS_ADMIN]}
            volumeMounts: [{name: host, mountPath: /host}]
rationale: Disable privileged mode without introducing new policy findings.
proposer: rule_based
created_at: 2026-10-21T00:00:00Z
