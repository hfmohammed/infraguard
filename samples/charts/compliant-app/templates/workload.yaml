apiVersion: apps/v1
kind: Deployment
metadata:
  name: compliant-app
  labels: {app: compliant-app, infraguard.io/tier: prod}
spec:
  replicas: {{ .Values.replicaCount }}
  selector: {matchLabels: {app: compliant-app}}
  template:
    metadata: {labels: {app: compliant-app}}
    spec:
      securityContext: {runAsNonRoot: true, runAsUser: 101}
      containers:
        - name: app
          image: {{ .Values.image }}
          ports: [{name: http, containerPort: 8080}]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {memory: 128Mi}
          livenessProbe: {httpGet: {path: /, port: 8080}}
          readinessProbe: {httpGet: {path: /, port: 8080}}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
            - {name: cache, mountPath: /var/cache/nginx}
            - {name: run, mountPath: /var/run}
      volumes:
        - {name: tmp, emptyDir: {}}
        - {name: cache, emptyDir: {}}
        - {name: run, emptyDir: {}}
---
apiVersion: v1
kind: Service
metadata: {name: compliant-app}
spec:
  type: ClusterIP
  selector: {app: compliant-app}
  ports: [{port: 80, targetPort: 8080}]
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: {name: compliant-app}
spec:
  minAvailable: 1
  selector: {matchLabels: {app: compliant-app}}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: default-deny}
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: allow-app}
spec:
  podSelector: {matchLabels: {app: compliant-app}}
  ingress:
    - from: [{podSelector: {}}]
      ports: [{protocol: TCP, port: 8080}]

