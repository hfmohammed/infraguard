apiVersion: apps/v1
kind: Deployment
metadata:
  name: compliant-app
  namespace: ig-compliant
  labels: {infraguard.io/tier: prod}
spec:
  replicas: 2
  selector: {matchLabels: {app: compliant-app}}
  template:
    metadata: {labels: {app: compliant-app}}
    spec:
      securityContext: {runAsNonRoot: true, runAsUser: 101}
      containers:
        - name: app
          image: nginxinc/nginx-unprivileged:1.27.0
          ports: [{containerPort: 8080}]
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          resources: {requests: {cpu: 50m, memory: 64Mi}, limits: {memory: 128Mi}}
          livenessProbe: {tcpSocket: {port: 8080}}
          readinessProbe: {tcpSocket: {port: 8080}}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: default-deny, namespace: ig-compliant}
spec: {podSelector: {}, policyTypes: [Ingress, Egress]}

