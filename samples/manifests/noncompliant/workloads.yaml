apiVersion: apps/v1
kind: Deployment
metadata:
  name: vulnerable-app
  namespace: ig-noncompliant
  labels: {infraguard.io/tier: prod}
spec:
  replicas: 1
  selector: {matchLabels: {app: vulnerable-app}}
  template:
    metadata: {labels: {app: vulnerable-app}}
    spec:
      hostNetwork: true
      volumes: [{name: host, hostPath: {path: /var/run}}]
      containers:
        - name: app
          image: nginx:latest
          securityContext: {privileged: true, runAsUser: 0, allowPrivilegeEscalation: true, readOnlyRootFilesystem: false, capabilities: {add: [SYS_ADMIN]}}
          volumeMounts: [{name: host, mountPath: /host}]
---
apiVersion: v1
kind: Service
metadata: {name: exposed-svc, namespace: ig-noncompliant}
spec: {type: NodePort, selector: {app: vulnerable-app}, ports: [{port: 80, nodePort: 30080}]}

